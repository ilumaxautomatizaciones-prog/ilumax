<script>

const pct = (a, b) => b > 0 ? (100 * a / b).toFixed(1) + '%' : '—';
let D = null, TAB = 'plan', FECHA = '', ARCH = null;

/* ===== Rejilla tipo Excel: ordenar y filtrar desde el encabezado, elegir columnas ===== */
const XG = {};

function xgView(id) {

  let R = g.rows.filter(r => (!g.est || g.est(r)) && (!q || g.cols.some(c => nz(xgV(c, r)).includes(q))) && g.cols.every(c => {
    const f = g.f[c.k]; if (!f) return true; const v = xgV(c, r);

  }));

  return R;
}
const xgOn = f => f && (f.sel || (f.min !== '' && f.min != null) || (f.max !== '' && f.max != null));
function xgQ(id, v) { XG[id].q = v; xgPaint(id); }
function xgEst(id, v) { const g = XG[id]; g.estv = v; g.est = v === 'pend' ? r => r.est === 'Pendiente' || r.est === 'Arrastrada' : v === 'desp' ? r => r.est === 'Despachada' : v === 'fuera' ? r => r.est === 'Fuera de corte' : null; xgPaint(id); }

  if (g.after) g.after(box);
}
function xgSort(id, k) { const g = XG[id]; g.sort = !g.sort || g.sort.k !== k ? { k, dir: 1 } : g.sort.dir > 0 ? { k, dir: -1 } : null; xgPaint(id); }
function xgLimpiar(id) { const g = XG[id]; g.f = {}; g.sort = null; xgPaint(id); }
function xgCerrar() { const m = $('xgm'); if (m) m.remove(); }
document.addEventListener('click', xgCerrar);
function xgPos(d, ev) { const b = ev.currentTarget.getBoundingClientRect(); d.style.top = Math.max(8, Math.min(b.bottom + 4, innerHeight - 440)) + 'px'; d.style.left = Math.max(8, Math.min(b.left - 120, innerWidth - 280)) + 'px'; }
function xgCols(ev, id) {
  ev.stopPropagation(); xgCerrar(); const g = XG[id], d = document.createElement('div'); d.id = 'xgm'; d.className = 'xgm'; d.onclick = e => e.stopPropagation(); xgPos(d, ev);
  d.innerHTML = '<b>Columnas visibles</b><div class="li" style="max-height:300px">' + g.cols.map((c, i) => '<label><input type="checkbox" ' + (g.hide.has(c.k) ? '' : 'checked') + ' onchange="xgToggle(\'' + id + '\',' + i + ',this.checked)"> ' + esc(c.t) + '</label>').join('') + '</div>';

  ev.stopPropagation(); xgCerrar(); const g = XG[id], c = g.cols.find(x => x.k === k), f = g.f[k] || {}, d = document.createElement('div'); d.id = 'xgm'; d.className = 'xgm'; d.onclick = e => e.stopPropagation(); xgPos(d, ev);
  const vals = c.num || c.date ? null : [...new Set(g.rows.map(r => String(xgV(c, r))))].sort((a, b) => a.localeCompare(b, 'es', { numeric: true })).slice(0, 600);

  const num = c.num ? 'menor a mayor' : 'A → Z', num2 = c.num ? 'mayor a menor' : 'Z → A';
  d.innerHTML = '<button class="btn g" style="width:100%;margin-bottom:4px" onclick="xgOrden(1)">↑ Ordenar ' + num + '</button><button class="btn g" style="width:100%" onclick="xgOrden(-1)">↓ Ordenar ' + num2 + '</button>'
    + (c.num ? '<div style="margin-top:8px">Mayor o igual a<input id="xgMin" value="' + esc(f.min == null ? '' : f.min) + '"></div><div>Menor o igual a<input id="xgMax" value="' + esc(f.max == null ? '' : f.max) + '"></div>' : '')
    + (c.date ? '<div style="margin-top:8px">Desde<input type="date" id="xgMin" value="' + esc(f.min || '') + '"></div><div>Hasta<input type="date" id="xgMax" value="' + esc(f.max || '') + '"></div>' : '')
    + (vals ? '<input id="xgBus" placeholder="Buscar…" style="margin-top:8px" oninput="xgBuscar(this.value)"><label style="margin-top:4px"><input type="checkbox" id="xgAll" ' + (!f.sel ? 'checked' : '') + ' onchange="xgTodos(this.checked)"> <b>(Seleccionar visibles)</b></label><div class="li" id="xgLi">' + vals.map((v, i) => '<label data-t="' + esc(nz(v)) + '"><input type="checkbox" class="xgc" data-i="' + i + '" ' + (!f.sel || f.sel.has(v) ? 'checked' : '') + '> ' + (v === '' ? '(vacío)' : esc(v)) + '</label>').join('') + '</div>' : '')
    + '<div style="display:flex;gap:6px;margin-top:8px"><button class="btn" style="flex:1" onclick="xgAplicar()">Aplicar</button><button class="btn g" style="flex:1" onclick="xgQuitar()">Quitar filtro</button></div>';

function xgOrden(dir) { const g = XG[XGM.id]; g.sort = { k: XGM.k, dir }; xgCerrar(); xgPaint(XGM.id); }

/* ===== Acceso por código ===== */
function token() {

}
function pinForm(msg) {

  $('app').innerHTML = '<div class="card" style="max-width:340px;margin:30px auto;padding:22px;text-align:center"><div style="font-size:34px">🚚</div><h2 style="border:0;padding:6px 0 4px">Ingresa tu código</h2><div style="font-size:12px;color:#64748b;margin-bottom:12px">Logística · despachos del día</div>'
    + '<input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="• • • •" style="width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:10px;border:1.5px solid #cbd5e1;border-radius:10px">'
    + (msg ? '<div style="color:#b91c1c;font-size:12.5px;margin-top:8px">' + esc(msg) + '</div>' : '')
    + '<button class="btn" style="margin-top:12px;width:100%" onclick="pinOk()">Entrar</button></div>';
  setTimeout(() => { const i = $('pinIn'); if (i) { i.focus(); i.onkeydown = e => { if (e.key === 'Enter') pinOk(); }; } }, 50);
}

  const v = ($('pinIn').value || '').trim();

}

  wM.getCell('A1').value = 'Nivel de despacho · ' + mes; wM.getCell('A1').font = { bold: true, size: 20, color: { argb: NAVY } };
  wM.getCell('A2').value = 'Por día, desde ' + D.inicio + '. Cumplimiento = unidades despachadas / unidades del plan del día.'; wM.getCell('A2').font = { italic: true, size: 9, color: { argb: 'FF64748B' } };
  const H = ['Día', 'Facturas plan', 'Unidades plan', 'Facturas nuevas', 'Facturas arrastre', 'Facturas despachadas', 'Unidades despachadas', 'Facturas pendientes', 'Unidades pendientes', 'Cumplimiento'];
  wM.addTable({ name: 'tblDia', ref: 'A4', headerRow: true, totalsRow: true, style: { theme: 'TableStyleLight1', showRowStripes: false },
    columns: H.map((n, i) => i === 0 ? { name: n, totalsRowLabel: 'TOTAL', filterButton: true } : i === 9 ? { name: n, filterButton: true } : { name: n, totalsRowFunction: 'sum', filterButton: true }),
    rows: DM.length ? DM.map((x, i) => [x.fecha, x.pf, x.pu, x.nf, x.af, x.df, x.du, x.qf, { formula: 'C' + (5 + i) + '-G' + (5 + i), result: x.qu }, { formula: 'IF(C' + (5 + i) + '=0,"",G' + (5 + i) + '/C' + (5 + i) + ')', result: x.pu > 0 ? x.du / x.pu : '' }]) : [['', 0, 0, 0, 0, 0, 0, 0, 0, '']] });
  wM.getRow(4).height = 30; wM.getRow(4).eachCell(c => { c.fill = fl(NAVY); c.font = { bold: true, color: { argb: 'FFFFFFFF' } }; c.alignment = { vertical: 'middle', horizontal: 'center', wrapText: true }; });
  const nD = DM.length; wM.getColumn(1).width = 14; for (let c = 2; c <= 10; c++) wM.getColumn(c).width = 15;
  for (let i = 5; i <= 4 + nD; i++) for (let c = 1; c <= 10; c++) { const k = wM.getCell(i, c); k.border = bd; if (c >= 2 && c <= 9) k.numFmt = '#,##0'; if (c === 10) k.numFmt = '0.0%'; }
  const tm = 5 + nD; wM.getRow(tm).eachCell(c => { c.fill = fl('FFE2E8F0'); c.font = { bold: true }; }); for (let c = 2; c <= 9; c++) wM.getCell(tm, c).numFmt = '#,##0';
  wM.getCell(tm, 10).value = { formula: 'IF(C' + tm + '=0,"",G' + tm + '/C' + tm + ')', result: '' }; wM.getCell(tm, 10).numFmt = '0.0%';
  if (nD) wM.addConditionalFormatting({ ref: 'J5:J' + (4 + nD), rules: [{ type: 'colorScale', cfvo: [{ type: 'num', value: 0.5 }, { type: 'num', value: 0.8 }, { type: 'num', value: 1 }], color: [{ argb: 'FFFCA5A5' }, { argb: 'FFFDE68A' }, { argb: 'FF86EFAC' }] }] });
  const buf = await wb.xlsx.writeBuffer(), url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })), el = document.createElement('a');
  el.href = url; el.download = 'Logistica_' + D.fecha + '.xlsx'; document.body.appendChild(el); el.click(); setTimeout(() => { el.remove(); URL.revokeObjectURL(url); }, 1500);
}

/* ===== Excel de despacho ===== */
function leerExcel(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]], M = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      ARCH = { nombre: f.name, M, h: 0, col: -1 };
      let h = M.findIndex(r => r.some(c => /factura|documento|\bdoc\b|n[uú]mero|nro/i.test(String(c)))); if (h < 0 || h > 15) h = 0; ARCH.h = h;
      const enc = (M[h] || []).map(c => String(c)); let col = enc.findIndex(c => /factura/i.test(c));
      if (col < 0) col = enc.findIndex(c => /documento|\bdoc\b/i.test(c));
      if (col < 0) col = enc.findIndex(c => /n[uú]mero|nro|n°/i.test(c));
      if (col < 0) { let best = 0; enc.forEach((c, i) => { const n = M.slice(h + 1).filter(r => /^[A-Za-z]{0,3}\d{4,6}$/.test(String(r[i]).trim())).length; if (n > best) { best = n; col = i; } }); }
      ARCH.col = col; ARCH.guias = null;
      const ix = k => enc.findIndex(c => c.toLowerCase().replace(/[^a-z_]/g, '') === k);
      const cG = ix('guia'), cD = ix('num_documentos');
      if (cG >= 0 && cD >= 0) { // Excel de la transportadora (cola de guías)
        ARCH.col = cD; ARCH.guias = { g: cG, d: ix('nom_destinatario'), c: ix('ciudest'), l: ix('num_unidades'), f: ix('totalguia'), fe: ix('fec_modif') };
        const cnt = {}; M.slice(h + 1).forEach(r => { const m = String(r[ARCH.guias.fe] || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if (m) { const k = m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2); cnt[k] = (cnt[k] || 0) + 1; } });
        const top = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x])[0]; if (top && $('dfecha')) $('dfecha').value = top;
      }
      resumenExcel();
    } catch (err) { $('dres').innerHTML = '<div class="err">No pude leer el archivo.</div>'; }
  };
  rd.readAsArrayBuffer(f);
}
const itemsExcel = () => { const G = ARCH.guias, seen = new Set(), res = []; if (!G) return res;
  ARCH.M.slice(ARCH.h + 1).forEach(r => { const doc = String(r[ARCH.col] == null ? '' : r[ARCH.col]).toUpperCase().replace(/[^A-Z0-9]/g, ''); if (!/\d{3}/.test(doc) || seen.has(doc)) return; seen.add(doc);
    res.push({ doc, guia: String(r[G.g] || '').replace(/\D/g, ''), destinatario: G.d >= 0 ? String(r[G.d] || '') : '', ciudad: G.c >= 0 ? String(r[G.c] || '') : '', lios: G.l >= 0 ? Number(r[G.l]) || 0 : null, flete: G.f >= 0 ? Number(r[G.f]) || 0 : null }); });
  return res; };
const numsExcel = () => [...new Set(ARCH.M.slice(ARCH.h + 1).map(r => { const v = r[ARCH.col]; return typeof v === 'number' ? String(Math.round(v)) : String(v == null ? '' : v).replace(/\D/g, ''); }).filter(x => x && x.length >= 3 && x.length <= 9))];
function resumenExcel() {
  const enc = (ARCH.M[ARCH.h] || []).map((c, i) => String(c).trim() || 'Columna ' + (i + 1));
  const n = ARCH.col >= 0 ? (ARCH.guias ? itemsExcel().length : numsExcel().length) : 0;
  $('dres').innerHTML = '<div class="bar"><label style="font-size:11px;color:#64748b">Columna de factura</label><select onchange="ARCH.col=+this.value;resumenExcel()">' + enc.map((c, i) => '<option value="' + i + '"' + (i === ARCH.col ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select><span style="font-size:12px;font-weight:700">' + fm(n) + ' facturas en «' + esc(ARCH.nombre) + '»' + (ARCH.guias ? ' · formato transportadora (guías)' : '') + '</span><button class="btn" ' + (n ? '' : 'disabled') + ' onclick="subirDespacho()">Marcar como despachadas</button></div>';
}
async function subirDespacho() {
  const items = ARCH.guias ? itemsExcel() : [], nums = numsExcel(); if (!items.length && !nums.length) return; const b = document.querySelector('#dres .btn'); if (b) { b.disabled = true; b.textContent = '⏳ Guardando…'; }
  const j = await api({ accion: 'despachar', fecha: $('dfecha').value, numeros: nums, items, archivo: ARCH.nombre });
  if (!j.ok) { $('dres').innerHTML = '<div class="err">' + esc(j.error || 'No se pudo guardar') + '</div>'; return; }
  const msg = '<div class="ok">✔ ' + fm(j.marcadas) + ' facturas marcadas como despachadas (' + fm(j.nuevas) + ' nuevas, ' + fm(j.yaMarcadas) + ' ya estaban).</div>'
    + (j.totalNo ? '<div class="err">' + fm(j.totalNo) + ' números del archivo no se encontraron en las facturas de Siesa: ' + esc(j.noEncontradas.slice(0, 40).join(', ')) + (j.totalNo > 40 ? '…' : '') + '</div>' : '');
  await cargar($('dfecha').value || D.fecha); const r = $('dres'); if (r) r.innerHTML = msg;
}

/* ===== Accesos (solo administrador) ===== */
async function accesos() {
  const j = await api({ accion: 'pins' }); if (!j.ok) { alert(j.error || 'No disponible'); return; }
  PINS = j.pins;
  let o = $('ovAcc'); if (!o) { o = document.createElement('div'); o.id = 'ovAcc'; o.className = 'ov'; document.body.appendChild(o); }
  o.innerHTML = '<div class="mo"><div class="mh">🔐 Accesos a Logística<button class="btn g" onclick="$(\'ovAcc\').classList.remove(\'on\')">✕</button></div><div class="cb"><div class="tw"><table><thead><tr><th>Nombre</th><th>Código</th><th>Activo</th><th>Último uso</th><th></th></tr></thead><tbody>'
    + (j.pins.map(p => '<tr><td>' + esc(p.nombre) + '</td><td>' + esc(p.pin) + '</td><td>' + (p.activo ? 'Sí' : 'No') + '</td><td>' + esc((p.ultimo_uso || '').slice(0, 16).replace('T', ' ')) + '</td><td><button class="btn g sm" onclick="pinAct(' + j.pins.indexOf(p) + ')">' + (p.activo ? 'Desactivar' : 'Activar') + '</button> <button class="btn r sm" style="margin:0" onclick="pinDel(\'' + p.id + '\')">Borrar</button></td></tr>').join('') || '<tr><td colspan="5" class="empty">Aún no hay códigos</td></tr>')
    + '</tbody></table></div><div class="bar" style="margin-top:12px"><input id="pnNom" placeholder="Nombre"><input id="pnPin" inputmode="numeric" maxlength="8" placeholder="Código 4 a 8 números"><button class="btn" onclick="pinNuevo()">Crear</button></div></div></div>';
  o.classList.add('on');
}
async function pinNuevo() { const j = await api({ accion: 'pin_guardar', nombre: $('pnNom').value, pin: $('pnPin').value }); if (!j.ok) { alert(j.error || 'No se pudo crear'); return; } accesos(); }
let PINS = [];
async function pinAct(i) { const p = PINS[i]; const j = await api({ accion: 'pin_guardar', id: p.id, nombre: p.nombre, pin: p.pin, activo: !p.activo }); if (!j.ok) alert(j.error || 'No se pudo cambiar'); accesos(); }
async function pinDel(id) { if (!confirm('¿Borrar este código?')) return; const j = await api({ accion: 'pin_borrar', id }); if (!j.ok) alert(j.error || 'No se pudo borrar'); accesos(); }
cargar();
</script>
