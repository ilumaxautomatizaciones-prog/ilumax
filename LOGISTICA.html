<body>
<div class="hdr"><h1>ILU<span>MAX</span> · Logística</h1><div class="sub" id="sub"></div><button class="out" id="out" style="display:none" onclick="pinSalir()">Salir</button></div>
<div class="wrap"><div id="app"><div class="err">Cargando logística…</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const API = 'https://vgjsfbudhrytvcgptdij.supabase.co/functions/v1/logistica-datos';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fm = n => Math.round(Number(n) || 0).toLocaleString('es-CO');
const fm2 = fm;
const nz = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const xNum = v => { if (typeof v === 'number') return v; let s = String(v == null ? '' : v).replace(/[\s]/g, ''); if (/,\d{1,2}$/.test(s) && /\./.test(s)) s = s.replace(/\./g, '').replace(',', '.'); else if (/,/.test(s) && !/\./.test(s)) s = s.replace(',', '.'); return Number(s); };
const pct = (a, b) => b > 0 ? (100 * a / b).toFixed(1) + '%' : '—';
let D = null, TAB = 'plan', FECHA = '', ARCH = null;

/* ===== Rejilla tipo Excel: ordenar y filtrar desde el encabezado, elegir columnas ===== */
const XG = {};
function xgInit(id, cols, opt) { const g = XG[id] || (XG[id] = { sort: null, f: {}, hide: new Set(), rows: [], limit: 600 }); g.cols = cols; Object.assign(g, opt || {}); return g; }
const xgV = (c, r) => { const v = c.v(r); return v == null ? '' : v; };
function xgView(id) {
  const g = XG[id];
  let R = g.rows.filter(r => g.cols.every(c => {
    const f = g.f[c.k]; if (!f) return true; const v = xgV(c, r);
    if (f.sel && !f.sel.has(String(v))) return false;
    if (c.num || c.date) {
      if (f.min !== '' && f.min != null) { if (v === '') return false; if (c.num ? Number(v) < Number(f.min) : String(v) < f.min) return false; }
      if (f.max !== '' && f.max != null) { if (v === '') return false; if (c.num ? Number(v) > Number(f.max) : String(v) > f.max) return false; }
    }
    return true;
  }));
  if (g.sort) { const c = g.cols.find(x => x.k === g.sort.k), d = g.sort.dir; if (c) R = R.map((r, i) => [r, i]).sort((a, b) => { const x = xgV(c, a[0]), y = xgV(c, b[0]); let o; if (c.num) o = (x === '' ? -Infinity : Number(x)) - (y === '' ? -Infinity : Number(y)); else o = String(x).localeCompare(String(y), 'es', { numeric: true }); return (o || a[1] - b[1]) * (o ? d : 1); }).map(x => x[0]); }
  return R;
}
const xgOn = f => f && (f.sel || (f.min !== '' && f.min != null) || (f.max !== '' && f.max != null));
function xgBar(id) { return '<div class="bar" style="padding:0 14px"><button class="btn g" onclick="xgCols(event,\'' + id + '\')">▦ Columnas</button><button class="btn g" onclick="xgLimpiar(\'' + id + '\')">✖ Quitar filtros y orden</button><button class="btn g" onclick="xgExcel(\'' + id + '\')">⬇ Excel de esta vista</button></div>'; }
function xgPaint(id) {
  const g = XG[id], box = $('xg_' + id); if (!box) return; const V = xgView(id), cols = g.cols.filter(c => !g.hide.has(c.k));
  const th = cols.map(c => { const s = g.sort && g.sort.k === c.k ? (g.sort.dir > 0 ? ' ▲' : ' ▼') : ''; return '<th class="xgh" style="text-align:' + (c.num && !c.al ? 'right' : 'left') + '"><span style="cursor:pointer" onclick="xgSort(\'' + id + '\',\'' + c.k + '\')">' + esc(c.t) + s + '</span><button class="xgb' + (xgOn(g.f[c.k]) ? ' on' : '') + '" onclick="xgMenu(event,\'' + id + '\',\'' + c.k + '\')">▾</button></th>'; }).join('');
  const rows = V.slice(0, g.limit).map(r => '<tr' + (g.attr ? g.attr(r) : '') + '>' + cols.map(c => '<td style="text-align:' + (c.num && !c.al ? 'right' : 'left') + (c.wrap ? ';white-space:normal;min-width:150px;max-width:280px;overflow-wrap:anywhere' : '') + '">' + (c.h ? c.h(r) : esc(xgV(c, r))) + '</td>').join('') + '</tr>').join('');
  const tot = '<tr class="tot">' + cols.map((c, i) => '<td style="text-align:' + (c.num && !c.al ? 'right' : 'left') + '">' + (i === 0 ? V.length + ' filas' : c.sum ? (c.dec ? fm2 : fm)(V.reduce((s, r) => s + (Number(xgV(c, r)) || 0), 0)) : '') + '</td>').join('') + '</tr>';
  box.innerHTML = '<table><thead><tr>' + th + '</tr></thead><tbody>' + (rows || '<tr><td colspan="' + cols.length + '" class="empty">Sin resultados</td></tr>') + '</tbody><tfoot>' + tot + '</tfoot></table>' + (V.length > g.limit ? '<div class="foot">Se muestran ' + g.limit + ' de ' + V.length + '; filtra para ver el resto (el Excel trae todas).</div>' : '');
  if (g.after) g.after(box);
}
function xgSort(id, k) { const g = XG[id]; g.sort = !g.sort || g.sort.k !== k ? { k, dir: 1 } : g.sort.dir > 0 ? { k, dir: -1 } : null; xgPaint(id); }
function xgLimpiar(id) { const g = XG[id]; g.f = {}; g.sort = null; xgPaint(id); }
function xgCerrar() { const m = $('xgm'); if (m) m.remove(); }
document.addEventListener('click', xgCerrar);
function xgPos(d, ev) { const b = ev.currentTarget.getBoundingClientRect(); d.style.top = Math.max(8, Math.min(b.bottom + 4, innerHeight - 440)) + 'px'; d.style.left = Math.max(8, Math.min(b.left - 120, innerWidth - 280)) + 'px'; }
function xgCols(ev, id) {
  ev.stopPropagation(); xgCerrar(); const g = XG[id], d = document.createElement('div'); d.id = 'xgm'; d.className = 'xgm'; d.onclick = e => e.stopPropagation(); xgPos(d, ev);
  d.innerHTML = '<b>Columnas visibles</b><div class="li" style="max-height:300px">' + g.cols.map((c, i) => '<label><input type="checkbox" ' + (g.hide.has(c.k) ? '' : 'checked') + ' onchange="xgToggle(\'' + id + '\',' + i + ',this.checked)"> ' + esc(c.t) + '</label>').join('') + '</div>';
  document.body.appendChild(d);
}
function xgToggle(id, i, on) { const g = XG[id], k = g.cols[i].k; if (on) g.hide.delete(k); else g.hide.add(k); xgPaint(id); }
let XGM = null;
function xgMenu(ev, id, k) {
  ev.stopPropagation(); xgCerrar(); const g = XG[id], c = g.cols.find(x => x.k === k), f = g.f[k] || {}, d = document.createElement('div'); d.id = 'xgm'; d.className = 'xgm'; d.onclick = e => e.stopPropagation(); xgPos(d, ev);
  const vals = c.num || c.date ? null : [...new Set(g.rows.map(r => String(xgV(c, r))))].sort((a, b) => a.localeCompare(b, 'es', { numeric: true })).slice(0, 600);
  XGM = { id, k, vals };
  const num = c.num ? 'menor a mayor' : 'A → Z', num2 = c.num ? 'mayor a menor' : 'Z → A';
  d.innerHTML = '<button class="btn g" style="width:100%;margin-bottom:4px" onclick="xgOrden(1)">↑ Ordenar ' + num + '</button><button class="btn g" style="width:100%" onclick="xgOrden(-1)">↓ Ordenar ' + num2 + '</button>'
    + (c.num ? '<div style="margin-top:8px">Mayor o igual a<input id="xgMin" value="' + esc(f.min == null ? '' : f.min) + '"></div><div>Menor o igual a<input id="xgMax" value="' + esc(f.max == null ? '' : f.max) + '"></div>' : '')
    + (c.date ? '<div style="margin-top:8px">Desde<input type="date" id="xgMin" value="' + esc(f.min || '') + '"></div><div>Hasta<input type="date" id="xgMax" value="' + esc(f.max || '') + '"></div>' : '')
    + (vals ? '<input id="xgBus" placeholder="Buscar…" style="margin-top:8px" oninput="xgBuscar(this.value)"><label style="margin-top:4px"><input type="checkbox" id="xgAll" ' + (!f.sel ? 'checked' : '') + ' onchange="xgTodos(this.checked)"> <b>(Seleccionar visibles)</b></label><div class="li" id="xgLi">' + vals.map((v, i) => '<label data-t="' + esc(nz(v)) + '"><input type="checkbox" class="xgc" data-i="' + i + '" ' + (!f.sel || f.sel.has(v) ? 'checked' : '') + '> ' + (v === '' ? '(vacío)' : esc(v)) + '</label>').join('') + '</div>' : '')
    + '<div style="display:flex;gap:6px;margin-top:8px"><button class="btn" style="flex:1" onclick="xgAplicar()">Aplicar</button><button class="btn g" style="flex:1" onclick="xgQuitar()">Quitar filtro</button></div>';
  document.body.appendChild(d);
}
function xgOrden(dir) { const g = XG[XGM.id]; g.sort = { k: XGM.k, dir }; xgCerrar(); xgPaint(XGM.id); }
function xgBuscar(t) { const q = nz(t); document.querySelectorAll('#xgLi label').forEach(l => { const ok = !q || l.dataset.t.includes(q); l.style.display = ok ? '' : 'none'; l.querySelector('input').checked = ok; }); const a = $('xgAll'); if (a) a.checked = true; }  // como en Excel: al buscar quedan marcados solo los que coinciden
function xgTodos(on) { document.querySelectorAll('#xgLi label').forEach(l => { if (l.style.display !== 'none') l.querySelector('input').checked = on; }); }
function xgAplicar() {
  const g = XG[XGM.id], c = g.cols.find(x => x.k === XGM.k), f = {};
  if (c.num || c.date) { const mn = $('xgMin').value.trim(), mx = $('xgMax').value.trim(); f.min = c.num ? (mn === '' ? '' : String(xNum(mn))) : mn; f.max = c.num ? (mx === '' ? '' : String(xNum(mx))) : mx; if (c.num && (f.min === 'NaN' || f.max === 'NaN')) { alert('Escribe números válidos.'); return; } }
  if (XGM.vals) { const chk = [...document.querySelectorAll('.xgc')], on = chk.filter(x => x.checked).map(x => XGM.vals[+x.dataset.i]); if (on.length < chk.length) f.sel = new Set(on); }
  if (xgOn(f)) g.f[XGM.k] = f; else delete g.f[XGM.k]; const id = XGM.id; xgCerrar(); xgPaint(id);
}
function xgQuitar() { const id = XGM.id; delete XG[id].f[XGM.k]; xgCerrar(); xgPaint(id); }
function xgExcel(id) {
  const g = XG[id], V = xgView(id), cols = g.cols.filter(c => !g.hide.has(c.k)); if (!V.length) { alert('No hay filas para exportar.'); return; }
  const ws = XLSX.utils.json_to_sheet(V.map(r => { const o = {}; cols.forEach(c => { const v = xgV(c, r); o[c.t] = c.num && v !== '' ? Number(v) : v; }); return o; })), wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'VISTA'); XLSX.writeFile(wb, (g.nombre || id) + '.xlsx');
}

/* ===== Acceso por código ===== */
function token() {
  const h = new URLSearchParams(location.hash.replace(/^#/, '')), q = new URLSearchParams(location.search);
  const u = h.get('k') || q.get('k') || ''; if (u) return u;
  try { return localStorage.getItem('lg_pin') || ''; } catch (e) { return ''; }
}
function pinForm(msg) {
  $('sub').textContent = ''; $('out').style.display = 'none';
  $('app').innerHTML = '<div class="card" style="max-width:340px;margin:30px auto;padding:22px;text-align:center"><div style="font-size:34px">🚚</div><h2 style="border:0;padding:6px 0 4px">Ingresa tu código</h2><div style="font-size:12px;color:#64748b;margin-bottom:12px">Logística · despachos del día</div>'
    + '<input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="• • • •" style="width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:10px;border:1.5px solid #cbd5e1;border-radius:10px">'
    + (msg ? '<div style="color:#b91c1c;font-size:12.5px;margin-top:8px">' + esc(msg) + '</div>' : '')
    + '<button class="btn" style="margin-top:12px;width:100%" onclick="pinOk()">Entrar</button></div>';
  setTimeout(() => { const i = $('pinIn'); if (i) { i.focus(); i.onkeydown = e => { if (e.key === 'Enter') pinOk(); }; } }, 50);
}
function pinOk() {
  const v = ($('pinIn').value || '').trim();
  if (!/^\d{4,8}$/.test(v)) { pinForm('El código son 4 a 8 números.'); return; }
  try { localStorage.setItem('lg_pin', v); } catch (e) { }
  $('app').innerHTML = '<div class="err">Cargando logística…</div>'; cargar();
}
function pinSalir() { try { localStorage.removeItem('lg_pin'); } catch (e) { } location.href = location.pathname; }
async function api(b) {
  try { const r = await fetch(API + '?k=' + encodeURIComponent(token()), { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(b) }); return await r.json().catch(() => ({ error: 'Respuesta no válida' })); } catch (e) { return { error: 'Sin conexión' }; }
}
async function cargar(f) {
  const k = token(); if (!k) { pinForm(); return; }
  try {
    const r = await fetch(API + '?k=' + encodeURIComponent(k) + (f ? '&fecha=' + f : '')); const d = await r.json().catch(() => ({}));
    if (r.status === 401) { try { localStorage.removeItem('lg_pin'); } catch (e) { } pinForm(d.error || 'Código no válido'); return; }
    if (r.status === 429) { pinForm(d.error || 'Demasiados intentos'); return; }
    if (!r.ok || !d.ok) { $('app').innerHTML = '<div class="err">' + esc(d.error || 'No se pudo cargar') + ' <button class="btn" onclick="cargar()">Reintentar</button></div>'; return; }
    D = d; FECHA = d.fecha; pintar();
  } catch (e) { $('app').innerHTML = '<div class="err">Sin conexión. <button class="btn" onclick="cargar()">Reintentar</button></div>'; }
}
const sumaDias = (f, n) => { const d = new Date(f + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const fechaL = f => { const d = new Date(f + 'T12:00:00Z'); return d.toLocaleDateString('es-CO', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' }); };
function irFecha(f) { if (/^\d{4}-\d{2}-\d{2}$/.test(f)) cargar(f); }

/* ===== Pantalla ===== */
function pintar() {
  $('out').style.display = ''; $('sub').textContent = D.nombre + ' · ' + fechaL(D.fecha) + ' · seguimiento desde ' + D.inicio;
  const dia = D.dias.find(x => x.fecha === D.fecha) || { pf: 0, pu: 0, nf: 0, nu: 0, af: 0, au: 0, df: 0, du: 0, qf: 0, qu: 0 };
  const fu = D.fuera.reduce((s, r) => s + r[3], 0);
  const kp = (l, v, s) => '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>';
  const kpis = '<div class="kpis">'
    + kp('A despachar hoy', fm(dia.pu) + ' und', fm(dia.pf) + ' facturas')
    + kp('Arrastre del día anterior', fm(dia.au) + ' und', fm(dia.af) + ' facturas')
    + kp('Despachadas', fm(dia.du) + ' und', fm(dia.df) + ' facturas')
    + kp('Pendientes', fm(dia.qu) + ' und', fm(dia.qf) + ' facturas')
    + kp('Cumplimiento', pct(dia.du, dia.pu), 'unidades despachadas / plan')
    + kp('Fuera de corte', fm(fu) + ' und', fm(D.fuera.length) + ' facturas · pasan a mañana')
    + '</div>';
  const series = [...new Set(['VE', 'VZ', 'VM', ...Object.keys(D.maxSerie), ...Object.keys(D.cortes)])];
  const cortes = '<div class="card"><h2>✂️ Corte del día</h2><div class="cortes">' + series.map(s => '<div class="f"><label>Serie ' + s + ' · hasta factura nº</label><input id="cor_' + s + '" inputmode="numeric" value="' + (D.cortes[s] || '') + '" placeholder="' + (D.maxSerie[s] ? 'última de hoy: ' + D.maxSerie[s] : 'sin facturas hoy') + '"><div class="s">' + (D.cortes[s] ? 'Corte guardado' : 'Sin corte: entra todo lo facturado') + '</div></div>').join('') + '</div>'
    + '<div class="bar pad"><button class="btn" onclick="guardarCortes()">Guardar cortes</button></div><div class="hint">Las facturas de la serie con número mayor al corte no entran hoy: quedan como «Fuera de corte» y pasan solas al plan de mañana. Deja el campo vacío para quitar el corte.</div></div>';
  const carga = '<div class="card"><h2>📥 Relación de despacho (Excel)</h2><div class="cb"><div class="bar" style="margin-top:0"><input type="file" id="dfile" accept=".xlsx,.xls,.csv" onchange="leerExcel(this)"><span class="fechab"><label style="font-size:11px;color:#64748b">Despachado el</label><input type="date" id="dfecha" value="' + D.fecha + '"></span></div><div id="dres"></div></div>'
    + '<div class="hint">Sube el archivo al final del día. Todas las facturas que traiga se marcan como despachadas en esa fecha; las que no aparezcan quedan pendientes y pasan al día siguiente.</div></div>';
  const tabs = '<div class="tabs"><button class="tab' + (TAB === 'plan' ? ' on' : '') + '" onclick="TAB=\'plan\';pintar()">Plan del día</button><button class="tab' + (TAB === 'hist' ? ' on' : '') + '" onclick="TAB=\'hist\';pintar()">Histórico por día</button>' + (D.admin ? '<button class="tab" onclick="accesos()">🔐 Accesos</button>' : '') + '</div>';
  const nav = '<div class="bar"><span class="fechab"><button class="btn g" onclick="irFecha(sumaDias(FECHA,-1))">◀</button><input type="date" value="' + D.fecha + '" onchange="irFecha(this.value)"><button class="btn g" onclick="irFecha(sumaDias(FECHA,1))">▶</button><button class="btn g" onclick="irFecha(D.hoy)">Hoy</button><button class="btn g" onclick="cargar(FECHA)">↻ Actualizar</button></span></div>';
  let cuerpo;
  if (TAB === 'plan') cuerpo = '<div class="card"><h2>Facturas del plan · ' + fechaL(D.fecha) + '</h2>' + xgBar('plan') + '<div class="bar pad"><button class="btn" onclick="marcarVisibles()">✔ Marcar visibles como despachadas</button><span style="font-size:11.5px;color:#64748b">Solo las pendientes que se ven con tus filtros.</span></div><div class="tw" id="xg_plan"></div></div>';
  else cuerpo = '<div class="card"><h2>Nivel de despacho por día</h2>' + xgBar('hist') + '<div class="tw" id="xg_hist"></div></div>';
  $('app').innerHTML = nav + kpis + cortes + carga + tabs + '<div id="cuerpo">' + cuerpo + '</div><div class="foot">Facturas y unidades desde Siesa (sin anuladas). Datos de ' + fm(D.dias.length) + ' día(s).</div>';
  if (TAB === 'plan') {
    const rows = D.filas.concat(D.fuera).map(r => ({ doc: r[0], fecha: r[1], cli: r[2], u: r[3], arr: r[4], est: r[5] === 'despachada' ? 'Despachada' : r[5] === 'fuera' ? 'Fuera de corte' : r[4] > 0 ? 'Arrastrada' : 'Pendiente' }));
    const pill = e => '<span class="pill ' + (e === 'Despachada' ? 'p-ok' : e === 'Fuera de corte' ? 'p-bl' : e === 'Arrastrada' ? 'p-rd' : 'p-or') + '">' + e + '</span>';
    xgInit('plan', [
      { k: 'doc', t: 'Factura', v: r => r.doc },
      { k: 'fecha', t: 'Fecha factura', v: r => r.fecha, date: true, al: true },
      { k: 'cli', t: 'Cliente', v: r => r.cli, wrap: true },
      { k: 'u', t: 'Unidades', v: r => r.u, num: true, sum: true },
      { k: 'arr', t: 'Días de arrastre', v: r => r.arr, num: true },
      { k: 'est', t: 'Estado', v: r => r.est, h: r => pill(r.est) },
      { k: 'x', t: '', v: r => '', h: r => r.est === 'Despachada' ? '<button class="btn g sm" title="Quitar despacho" onclick="quitar(\'' + r.doc + '\')">↩ Quitar</button>' : r.est === 'Fuera de corte' ? '' : '<button class="btn sm" title="Marcar como despachada" onclick="marcarDesp(\'' + r.doc + '\')">✔ Despachada</button>' }
    ], { rows, nombre: 'Logistica_' + D.fecha });
    xgPaint('plan');
  } else {
    const rows = D.dias.slice().reverse().map(x => ({ fecha: x.fecha, pf: x.pf, pu: x.pu, nf: x.nf, af: x.af, df: x.df, du: x.du, qf: x.qf, qu: x.qu, cum: x.pu > 0 ? Math.round(1000 * x.du / x.pu) / 10 : '' }));
    xgInit('hist', [
      { k: 'fecha', t: 'Día', v: r => r.fecha, date: true, al: true },
      { k: 'pf', t: 'Facturas plan', v: r => r.pf, num: true, sum: true },
      { k: 'pu', t: 'Unidades plan', v: r => r.pu, num: true, sum: true },
      { k: 'nf', t: 'Facturas nuevas', v: r => r.nf, num: true, sum: true },
      { k: 'af', t: 'Facturas arrastre', v: r => r.af, num: true, sum: true },
      { k: 'df', t: 'Facturas despachadas', v: r => r.df, num: true, sum: true },
      { k: 'du', t: 'Unidades despachadas', v: r => r.du, num: true, sum: true },
      { k: 'qf', t: 'Facturas pendientes', v: r => r.qf, num: true, sum: true },
      { k: 'qu', t: 'Unidades pendientes', v: r => r.qu, num: true, sum: true },
      { k: 'cum', t: '% cumplimiento (und)', v: r => r.cum, num: true, h: r => r.cum === '' ? '' : r.cum + '%' }
    ], { rows, nombre: 'Logistica_historico', attr: r => ' class="c" onclick="irFecha(\'' + r.fecha + '\');TAB=\'plan\'"' });
    xgPaint('hist');
  }
}
async function guardarCortes() {
  const ins = [...document.querySelectorAll('[id^=cor_]')]; let err = '';
  for (const i of ins) {
    const s = i.id.slice(4), v = i.value.replace(/\D/g, ''), antes = String(D.cortes[s] || '');
    if (v === antes) continue;
    const j = await api({ accion: 'corte', fecha: D.fecha, serie: s, hasta: v }); if (!j.ok) err = j.error || 'No se pudo guardar';
  }
  if (err) { alert(err); return; }
  await cargar(D.fecha);
}
async function marcarDesp(doc) {
  const j = await api({ accion: 'despachar', fecha: D.fecha, numeros: [doc.replace(/\D/g, '')], archivo: 'manual' });
  if (!j.ok) { alert(j.error || 'No se pudo marcar'); return; } await cargar(D.fecha);
}
async function marcarVisibles() {
  const R = xgView('plan').filter(r => r.est === 'Pendiente' || r.est === 'Arrastrada'); if (!R.length) { alert('No hay pendientes en la vista.'); return; }
  if (!confirm('¿Marcar ' + R.length + ' facturas (' + fm(R.reduce((a, r) => a + r.u, 0)) + ' und) como despachadas el ' + D.fecha + '?')) return;
  const j = await api({ accion: 'despachar', fecha: D.fecha, numeros: R.map(r => r.doc.replace(/\D/g, '')), archivo: 'manual' });
  if (!j.ok) { alert(j.error || 'No se pudo marcar'); return; } await cargar(D.fecha);
}
async function quitar(doc) { if (!confirm('¿Quitar el despacho de la factura ' + doc + '? Volverá a quedar pendiente.')) return; const j = await api({ accion: 'quitar', doc }); if (!j.ok) { alert(j.error || 'No se pudo quitar'); return; } await cargar(D.fecha); }

/* ===== Excel de despacho ===== */
function leerExcel(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]], M = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
      ARCH = { nombre: f.name, M, h: 0, col: -1 };
      let h = M.findIndex(r => r.some(c => /factura|documento|\bdoc\b|n[uú]mero|nro/i.test(String(c)))); if (h < 0 || h > 15) h = 0; ARCH.h = h;
      const enc = (M[h] || []).map(c => String(c)); let col = enc.findIndex(c => /factura/i.test(c));
      if (col < 0) col = enc.findIndex(c => /documento|\bdoc\b/i.test(c));
      if (col < 0) col = enc.findIndex(c => /n[uú]mero|nro|n°/i.test(c));
      if (col < 0) { let best = 0; enc.forEach((c, i) => { const n = M.slice(h + 1).filter(r => /^[A-Za-z]{0,3}\d{4,6}$/.test(String(r[i]).trim())).length; if (n > best) { best = n; col = i; } }); }
      ARCH.col = col; resumenExcel();
    } catch (err) { $('dres').innerHTML = '<div class="err">No pude leer el archivo.</div>'; }
  };
  rd.readAsArrayBuffer(f);
}
const numsExcel = () => [...new Set(ARCH.M.slice(ARCH.h + 1).map(r => { const v = r[ARCH.col]; return typeof v === 'number' ? String(Math.round(v)) : String(v == null ? '' : v).replace(/\D/g, ''); }).filter(x => x && x.length >= 3 && x.length <= 9))];
function resumenExcel() {
  const enc = (ARCH.M[ARCH.h] || []).map((c, i) => String(c).trim() || 'Columna ' + (i + 1));
  const n = ARCH.col >= 0 ? numsExcel().length : 0;
  $('dres').innerHTML = '<div class="bar"><label style="font-size:11px;color:#64748b">Columna de factura</label><select onchange="ARCH.col=+this.value;resumenExcel()">' + enc.map((c, i) => '<option value="' + i + '"' + (i === ARCH.col ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select><span style="font-size:12px;font-weight:700">' + fm(n) + ' facturas en «' + esc(ARCH.nombre) + '»</span><button class="btn" ' + (n ? '' : 'disabled') + ' onclick="subirDespacho()">Marcar como despachadas</button></div>';
}
async function subirDespacho() {
  const nums = numsExcel(); if (!nums.length) return; const b = document.querySelector('#dres .btn'); if (b) { b.disabled = true; b.textContent = '⏳ Guardando…'; }
  const j = await api({ accion: 'despachar', fecha: $('dfecha').value, numeros: nums, archivo: ARCH.nombre });
  if (!j.ok) { $('dres').innerHTML = '<div class="err">' + esc(j.error || 'No se pudo guardar') + '</div>'; return; }
  const msg = '<div class="ok">✔ ' + fm(j.marcadas) + ' facturas marcadas como despachadas (' + fm(j.nuevas) + ' nuevas, ' + fm(j.yaMarcadas) + ' ya estaban).</div>'
    + (j.totalNo ? '<div class="err">' + fm(j.totalNo) + ' números del archivo no se encontraron en las facturas de Siesa: ' + esc(j.noEncontradas.slice(0, 40).join(', ')) + (j.totalNo > 40 ? '…' : '') + '</div>' : '');
  await cargar($('dfecha').value || D.fecha); const r = $('dres'); if (r) r.innerHTML = msg;
}

/* ===== Accesos (solo administrador) ===== */
async function accesos() {
  const j = await api({ accion: 'pins' }); if (!j.ok) { alert(j.error || 'No disponible'); return; }
  PINS = j.pins;
  let o = $('ovAcc'); if (!o) { o = document.createElement('div'); o.id = 'ovAcc'; o.className = 'ov'; document.body.appendChild(o); }
  o.innerHTML = '<div class="mo"><div class="mh">🔐 Accesos a Logística<button class="btn g" onclick="$(\'ovAcc\').classList.remove(\'on\')">✕</button></div><div class="cb"><div class="tw"><table><thead><tr><th>Nombre</th><th>Código</th><th>Activo</th><th>Último uso</th><th></th></tr></thead><tbody>'
    + (j.pins.map(p => '<tr><td>' + esc(p.nombre) + '</td><td>' + esc(p.pin) + '</td><td>' + (p.activo ? 'Sí' : 'No') + '</td><td>' + esc((p.ultimo_uso || '').slice(0, 16).replace('T', ' ')) + '</td><td><button class="btn g sm" onclick="pinAct(' + j.pins.indexOf(p) + ')">' + (p.activo ? 'Desactivar' : 'Activar') + '</button> <button class="btn r sm" style="margin:0" onclick="pinDel(\'' + p.id + '\')">Borrar</button></td></tr>').join('') || '<tr><td colspan="5" class="empty">Aún no hay códigos</td></tr>')
    + '</tbody></table></div><div class="bar" style="margin-top:12px"><input id="pnNom" placeholder="Nombre"><input id="pnPin" inputmode="numeric" maxlength="8" placeholder="Código 4 a 8 números"><button class="btn" onclick="pinNuevo()">Crear</button></div></div></div>';
  o.classList.add('on');
}
async function pinNuevo() { const j = await api({ accion: 'pin_guardar', nombre: $('pnNom').value, pin: $('pnPin').value }); if (!j.ok) { alert(j.error || 'No se pudo crear'); return; } accesos(); }
let PINS = [];
async function pinAct(i) { const p = PINS[i]; const j = await api({ accion: 'pin_guardar', id: p.id, nombre: p.nombre, pin: p.pin, activo: !p.activo }); if (!j.ok) alert(j.error || 'No se pudo cambiar'); accesos(); }
async function pinDel(id) { if (!confirm('¿Borrar este código?')) return; const j = await api({ accion: 'pin_borrar', id }); if (!j.ok) alert(j.error || 'No se pudo borrar'); accesos(); }
cargar();
</script>
