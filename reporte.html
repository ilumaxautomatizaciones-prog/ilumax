<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1e293b">
<title>Reporte Diario de Ventas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{overflow-x:hidden;max-width:100vw}
body{margin:0;font-family:Inter,sans-serif;font-size:14px;background:#f1f5f9;color:#0f172a}
.hdr{background:linear-gradient(135deg,#1e293b,#0f172a);color:#fff;padding:16px;position:relative}
.hdr h1{margin:0;font-size:18px;font-weight:800;letter-spacing:.3px}
.hdr h1 span{color:#f5c518}
.hdr .sub{font-size:12px;color:#cbd5e1;margin-top:4px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:12px 14px}
.kpi .l{font-size:10px;color:#64748b;text-transform:uppercase;font-weight:700;letter-spacing:.4px}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px}
.kpi .s{font-size:11px;color:#64748b;margin-top:2px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;margin-bottom:14px;overflow:hidden}
.card h2{margin:0;padding:12px 14px;font-size:13px;font-weight:800;border-bottom:1px solid #e2e8f0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th{padding:7px 8px;font-size:10px;color:#fff;background:#0f172a;text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:6px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid #eef2f7}
tr.tot td{font-weight:800;background:#0f172a;color:#fff}
.sticky td:first-child,.sticky th:first-child{position:sticky;left:0;z-index:1}
.sticky td:first-child{background:#fff}
.ok{color:#047857;font-weight:700}.mid{color:#b45309;font-weight:700}.bad{color:#b91c1c;font-weight:700}
.err{max-width:480px;margin:60px auto;text-align:center;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:28px}
.foot{font-size:11px;color:#64748b;text-align:center;padding:8px 0 24px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid #e2e8f0;background:#fff;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;color:#475569}
.tab.on{background:#0f172a;color:#fff;border-color:#0f172a}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar select,.bar input{font:inherit;font-size:12px;padding:7px 10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;max-width:100%}
.bar input{flex:1 1 220px}
.btn{font:inherit;font-size:12px;font-weight:700;padding:8px 14px;border:0;border-radius:8px;background:#f5c518;color:#0f172a;cursor:pointer}
.sub2{display:flex;gap:6px;padding:10px 14px 0;flex-wrap:wrap}
.chip{border:1px solid #e2e8f0;background:#fff;border-radius:16px;padding:5px 12px;font-size:11px;font-weight:700;cursor:pointer;color:#475569}
.chip.on{background:#1e40af;color:#fff;border-color:#1e40af}
th.s{cursor:pointer}
.warn{background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:10px;padding:8px 12px;font-size:12px;margin-bottom:12px}
.pbar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:#16a34a}
.up{color:#047857}.dn{color:#b91c1c}
@media(max-width:640px){.wrap{padding:10px}.kpi .v{font-size:17px}}
</style>
</head>
<body>
<div class="hdr"><h1>ILU<span>MAX</span> · Reporte Diario de Ventas</h1><div class="sub" id="sub">Cargando…</div></div>
<div class="wrap"><div class="tabs"><div class="tab on" id="t-res" onclick="verTab('res')">📊 Resumen del equipo</div><div class="tab" id="t-cum" onclick="verTab('cum')">🎯 Cumplimiento</div><div class="tab" id="t-sem" onclick="verTab('sem')">📅 Semana</div><div class="tab" id="t-ase" onclick="verTab('ase')">👤 Por asesor / clientes</div></div><div id="app"><div class="err">Cargando reporte…</div></div><div id="cum" style="display:none"></div><div id="sem" style="display:none"></div><div id="det" style="display:none"></div></div>
<div class="foot">Se actualiza solo cada 5 minutos · Datos de Siesa</div>
<script>
const API = 'https://vgjsfbudhrytvcgptdij.supabase.co/functions/v1/reporte-ventas-datos';
const GR = [['ESP','Especializado','#2f6fd0','#dbe6f7'],['MIX','Mixto','#6b8e23','#e3ecd0'],['PRO','Proyectos','#e36c0a','#fde3cf'],['ONL','Online','#8e7cc3','#e6e0f0'],['HOM','Home Center','#be185d','#fbd5e5']];
const $ = n => n ? '$ ' + Math.round(n).toLocaleString('es-CO') : '$ -';
const pc = (v, p) => p > 0 ? Math.round(v / p * 100) + '%' : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dmy = iso => { const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; };
const fh = ts => { try { return new Date(ts).toLocaleString('es-CO', {timeZone:'America/Bogota', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hour12:true}); } catch (e) { return ''; } };
const cls = r => r >= 1 ? 'ok' : r >= .7 ? 'mid' : 'bad';
function token() {
  const h = new URLSearchParams(location.hash.replace(/^#/, '')), q = new URLSearchParams(location.search);
  return h.get('k') || q.get('k') || '';
}
let LAST = null, RANGO = 'mes';
const iso = d => d.toISOString().slice(0, 10);
const lunesDe = s => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return iso(d); };
const sumDias = (s, n) => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
function rangoFechas() {
  const c = LAST.corte;
  if (RANGO === 'hoy') return [c, c];
  if (RANGO === 'sem') return [lunesDe(c), c];
  if (RANGO === 'semp') { const l = sumDias(lunesDe(c), -7); return [l, sumDias(l, 6)]; }
  return [c.slice(0, 8) + '01', c];
}
function setRango(r) { RANGO = r; if (r !== 'mes' && !DET.cargado) { DET.mes = ''; cargarDet(''); return; } pintar(LAST); }
// Resumen para un rango: venta real de las facturas del rango; presupuesto prorrateado por días con venta
function sintetizar(d) {
  const [a, b] = rangoFechas(), mes = d.corte.slice(0, 7);
  const mesRows = DET.rows.filter(f => f[0].slice(0, 7) === mes), rows = mesRows.filter(f => f[0] >= a && f[0] <= b);
  const diasMes = new Set(mesRows.map(f => f[0])).size, diasR = new Set(rows.map(f => f[0])).size, fac = diasMes ? diasR / diasMes : 0;
  const GRP = { 'ESPECIALIZADO': 'ESP', 'CANAL MIXTO': 'MIX', 'PROYECTOS': 'PRO', 'ONLINE': 'ONL', 'CANAL HOMECENTER': 'HOM', 'DISTRIBUIDOR': 'DIS' };
  const ej = {}; d.ejecutivos.forEach(e => ej[e.nombre] = { nombre: e.nombre, v: { ESP: 0, MIX: 0, PRO: 0, ONL: 0, HOM: 0, DIS: 0, OTR: 0, total: 0, dia: 0 }, p: Object.fromEntries(Object.entries(e.p).map(([k, v]) => [k, v * fac])) });
  const cn = {}; d.canales.forEach(c => cn[c.nombre] = { nombre: c.nombre, dia: 0, acum: 0, ppto: c.ppto * fac });
  rows.forEach(f => {
    const e = ej[f[3]] || (ej[f[3]] = { nombre: f[3], v: { ESP: 0, MIX: 0, PRO: 0, ONL: 0, HOM: 0, DIS: 0, OTR: 0, total: 0, dia: 0 }, p: { ESP: 0, MIX: 0, PRO: 0, ONL: 0, HOM: 0 } });
    e.v[GRP[f[4]] || 'OTR'] += f[5]; e.v.total += f[5];
    const c = cn[f[4]] || (cn[f[4]] = { nombre: f[4], dia: 0, acum: 0, ppto: 0 }); c.acum += f[5];
  });
  const acum = rows.reduce((x, f) => x + f[5], 0), dia = rows.filter(f => f[0] === b).reduce((x, f) => x + f[5], 0);
  Object.values(cn).forEach(c => c.dia = rows.filter(f => f[4] === c.nombre && f[0] === b).reduce((x, f) => x + f[5], 0));
  const sem = {}; rows.forEach(f => { const k = lunesDe(f[0]); sem[k] = (sem[k] || 0) + f[5]; });
  return Object.assign({}, d, { kpis: Object.assign({}, d.kpis, { dia, acum, ppto: d.kpis.ppto * fac, facturas: rows.length, proy: acum }), canales: Object.values(cn).sort((x, y) => y.acum - x.acum), ejecutivos: Object.values(ej).sort((x, y) => y.v.total - x.v.total), semanas: Object.entries(sem).sort().map(([lunes, venta]) => ({ lunes, venta })), _rango: [a, b] });
}
function pintar(d0) {
  LAST = d0;
  let d = d0;
  if (RANGO !== 'mes' && DET.cargado && DET.mes !== d0.corte.slice(0, 7)) { cargarDet(d0.corte.slice(0, 7)); return; }
  const filtro = '<div class="bar" style="margin-bottom:10px">' + [['mes', 'Todo el mes'], ['hoy', 'Último día'], ['sem', 'Esta semana'], ['semp', 'Semana pasada']].map(x => '<div class="chip' + (RANGO === x[0] ? ' on' : '') + '" onclick="setRango(\'' + x[0] + '\')">' + x[1] + '</div>').join('') + '</div>';
  if (RANGO !== 'mes' && DET.cargado) { try { d = sintetizar(d0); } catch (e) { d = d0; } }
  const nota = RANGO !== 'mes' && d._rango ? '<div class="warn" style="background:#eff6ff;color:#1e40af;border-color:#bfdbfe">Mostrando del <b>' + dmy(d._rango[0]) + '</b> al <b>' + dmy(d._rango[1]) + '</b>. El presupuesto se prorratea por días con venta.</div>' : '';
  const k = d.kpis, cum = k.ppto > 0 ? k.acum / k.ppto : 0;
  document.getElementById('sub').innerHTML = 'Corte al <b>' + dmy(d.corte) + '</b> · Actualizado ' + (d.fuente ? fh(d.fuente) : fh(d.generado)) + ' · ' + k.facturas + ' facturas del mes';
  const kp = (l, v, s, c) => '<div class="kpi"><div class="l">' + l + '</div><div class="v ' + (c || '') + '">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  let h = filtro + nota + '<div class="kpis">'
    + kp('Venta del último día', $(k.dia), dmy(d.corte), 'ok')
    + kp(RANGO === 'mes' ? 'Venta acumulada del mes' : 'Venta del período', $(k.acum))
    + kp(RANGO === 'mes' ? 'Presupuesto del mes' : 'Presupuesto prorrateado', $(k.ppto))
    + kp('% cumplimiento', k.ppto ? Math.round(cum * 100) + '%' : '—', null, k.ppto ? cls(cum) : '')
    + (RANGO === 'mes' ? kp('Proyección fin de mes', $(k.proy), k.ppto ? Math.round(k.proy / k.ppto * 100) + '% del presupuesto' : '') : '')
    + '</div>';
  // Ejecutivos x canal
  const E = d.ejecutivos, T = {}; GR.forEach(g => T[g[0]] = [0, 0]); let tDis = 0, tOtr = 0, tP = 0, tV = 0;
  const cel = (p, v, bg) => '<td style="background:' + bg + '">' + $(p) + '</td><td style="background:' + bg + ';font-weight:700">' + $(v) + '</td><td style="background:' + bg + ';font-weight:700">' + pc(v, p) + '</td>';
  const filas = E.map(e => {
    const pT = GR.reduce((a, g) => a + (e.p[g[0]] || 0), 0);
    GR.forEach(g => { T[g[0]][0] += e.p[g[0]] || 0; T[g[0]][1] += e.v[g[0]] || 0; });
    tDis += e.v.DIS || 0; tOtr += e.v.OTR || 0; tP += pT; tV += e.v.total;
    return '<tr><td style="font-weight:600">' + esc(e.nombre) + '</td>' + GR.map(g => cel(e.p[g[0]] || 0, e.v[g[0]] || 0, g[3])).join('')
      + '<td style="background:#d9edf2">' + $(e.v.DIS) + '</td><td style="background:#eceff3">' + $(e.v.OTR) + '</td>' + cel(pT, e.v.total, '#fff') + '</tr>';
  }).join('');
  const th = (t, bg, cs) => '<th' + (cs ? ' colspan="' + cs + '"' : '') + ' style="background:' + bg + ';text-align:center">' + t + '</th>';
  h += '<div class="card"><h2>Ejecutivos por canal — presupuesto, venta acumulada y % de cumplimiento</h2><div class="tw"><table class="sticky"><thead>'
    + '<tr>' + th('', '#000') + GR.map(g => th(g[1], g[2], 3)).join('') + th('Distribuidor', '#2a8a9a') + th('Otros canales', '#64748b') + th('TOTAL', '#000', 3) + '</tr>'
    + '<tr>' + th('Ejecutivo', '#000') + GR.map(g => th('PPTO', g[2]) + th('Venta Acum', g[2]) + th('%Cump', g[2])).join('') + th('Venta Acum', '#2a8a9a') + th('Venta Acum', '#64748b') + th('PPTO', '#000') + th('Venta Acum', '#000') + th('%Cump', '#000') + '</tr></thead><tbody>'
    + filas + '<tr class="tot"><td>Total general</td>' + GR.map(g => '<td style="background:' + g[2] + '">' + $(T[g[0]][0]) + '</td><td style="background:' + g[2] + '">' + $(T[g[0]][1]) + '</td><td style="background:' + g[2] + '">' + pc(T[g[0]][1], T[g[0]][0]) + '</td>').join('')
    + '<td style="background:#2a8a9a">' + $(tDis) + '</td><td style="background:#64748b">' + $(tOtr) + '</td><td>' + $(tP) + '</td><td>' + $(tV) + '</td><td>' + pc(tV, tP) + '</td></tr></tbody></table></div>'
    + '<div style="padding:8px 14px;font-size:11px;color:#64748b">«Otros canales» incluye Hard Discount, Canal Moderno, Constructoras, Institucional y Empleados.</div></div>';
  // Canales
  const tc = d.canales.reduce((a, c) => ({ dia: a.dia + c.dia, acum: a.acum + c.acum, ppto: a.ppto + c.ppto }), { dia: 0, acum: 0, ppto: 0 });
  h += '<div class="card"><h2>Venta por canal</h2><div class="tw"><table><thead><tr><th>Canal</th><th>Último día</th><th>Venta acumulada</th><th>Presupuesto</th><th>% cumpl.</th></tr></thead><tbody>'
    + d.canales.map(c => '<tr><td style="font-weight:600">' + esc(c.nombre) + '</td><td>' + $(c.dia) + '</td><td style="font-weight:700">' + $(c.acum) + '</td><td>' + (c.ppto ? $(c.ppto) : '—') + '</td><td class="' + (c.ppto ? cls(c.acum / c.ppto) : '') + '">' + pc(c.acum, c.ppto) + '</td></tr>').join('')
    + '<tr class="tot"><td>Total</td><td>' + $(tc.dia) + '</td><td>' + $(tc.acum) + '</td><td>' + (tc.ppto ? $(tc.ppto) : '—') + '</td><td>' + pc(tc.acum, tc.ppto) + '</td></tr></tbody></table></div></div>';
  // Semanas
  let ac = 0;
  h += '<div class="card"><h2>Venta por semana</h2><div class="tw"><table><thead><tr><th>Semana (lunes)</th><th>Venta de la semana</th><th>Acumulado del mes</th></tr></thead><tbody>'
    + d.semanas.map(s => { ac += s.venta; return '<tr><td>' + dmy(s.lunes) + '</td><td>' + $(s.venta) + '</td><td style="font-weight:700">' + $(ac) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  document.getElementById('app').innerHTML = h;
}
async function cargar() {
  const k = token();
  if (!k) { document.getElementById('sub').textContent = ''; document.getElementById('app').innerHTML = '<div class="err"><b>Falta el código del link.</b><br>Abre el link completo que te compartieron.</div>'; return; }
  try {
    const r = await fetch(API + '?k=' + encodeURIComponent(k), { cache: 'no-store' });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || 'Error');
    pintar(d); if (TAB === 'cum') pintarCum();
  } catch (e) {
    if (!document.querySelector('.kpis')) { document.getElementById('sub').textContent = ''; document.getElementById('app').innerHTML = '<div class="err"><b>No se pudo abrir el reporte.</b><br>' + esc(e.message) + '<br><span style="color:#64748b;font-size:12px">Pide el link actualizado a Duvier.</span></div>'; }
  }
}

// ───────── Cumplimiento ─────────
function habiles(desde, hasta) { let n = 0; for (let x = desde; x <= hasta; x = sumDias(x, 1)) { if (new Date(x + 'T12:00:00Z').getUTCDay() !== 0) n++; } return n; }
function pintarCum() {
  const el = document.getElementById('cum'); if (!LAST) { el.innerHTML = '<div class="err">Cargando…</div>'; return; }
  const d = LAST, c = d.corte, ini = c.slice(0, 8) + '01', fin = iso(new Date(Date.UTC(+c.slice(0, 4), +c.slice(5, 7), 0)));
  const hT = habiles(ini, fin), hP = habiles(ini, c), hR = Math.max(0, hT - hP);
  const filas = d.ejecutivos.map(e => { const p = ['ESP', 'MIX', 'PRO', 'ONL', 'HOM'].reduce((a, g) => a + (e.p[g] || 0), 0); return { n: e.nombre, p, v: e.v.total }; }).filter(x => x.p > 0).sort((a, b) => b.v / b.p - a.v / a.p);
  const tp = filas.reduce((a, x) => a + x.p, 0), tv = filas.reduce((a, x) => a + x.v, 0);
  const fila = (n, p, v, tot) => { const pr = hP ? v / hP * hT : 0, r = v / p, falta = Math.max(0, p - v), req = hR ? falta / hR : falta, st = pr >= p ? ['En ritmo', 'ok'] : pr >= p * .8 ? ['Cerca', 'mid'] : ['Atrasado', 'bad'];
    return '<tr' + (tot ? ' class="tot"' : '') + '><td' + (tot ? '' : ' style="font-weight:600"') + '>' + esc(n) + '</td><td>' + $(p) + '</td><td style="font-weight:700">' + $(v) + '</td><td class="' + (tot ? '' : cls(r)) + '">' + Math.round(r * 100) + '%</td><td>' + $(falta) + '</td><td>' + $(req) + '</td><td>' + $(pr) + '</td><td class="' + (tot ? '' : st[1]) + '">' + (v >= p ? '✅ Cumplida' : st[0]) + '</td></tr>'; };
  el.innerHTML = '<div class="kpis"><div class="kpi"><div class="l">Días hábiles del mes</div><div class="v">' + hT + '</div><div class="s">Lunes a sábado</div></div><div class="kpi"><div class="l">Transcurridos</div><div class="v">' + hP + '</div></div><div class="kpi"><div class="l">Por trabajar</div><div class="v">' + hR + '</div><div class="s">Sin contar festivos</div></div><div class="kpi"><div class="l">Equipo</div><div class="v ' + cls(tv / (tp || 1)) + '">' + Math.round(tv / (tp || 1) * 100) + '%</div><div class="s">' + $(tv) + ' de ' + $(tp) + '</div></div></div>'
    + '<div class="card"><h2>Cumplimiento por ejecutivo — ¿cuánto falta y a qué ritmo?</h2><div class="tw"><table class="sticky"><thead><tr><th>Ejecutivo</th><th>Presupuesto</th><th>Venta acum.</th><th>% cumpl.</th><th>Falta por vender</th><th>Venta diaria necesaria</th><th>Proyección al cierre</th><th>Estado</th></tr></thead><tbody>'
    + filas.map(x => fila(x.n, x.p, x.v)).join('') + fila('EQUIPO', tp, tv, true) + '</tbody></table></div><div style="padding:8px 14px;font-size:11px;color:#64748b">Proyección = venta acumulada ÷ días hábiles transcurridos × días hábiles del mes. «En ritmo» si proyecta ≥100% · «Cerca» ≥80% · «Atrasado» menos. Solo aparecen ejecutivos con presupuesto asignado.</div></div>';
}
// ───────── Semana (día por día) ─────────
const SEMW = { l: '' };
function pintarSem() {
  const el = document.getElementById('sem'); if (!DET.cargado) { el.innerHTML = '<div class="err">Cargando…</div>'; return; }
  const rows = DET.rows, lunes = [...new Set(rows.map(f => lunesDe(f[0])))].sort().reverse();
  if (!SEMW.l || !lunes.includes(SEMW.l)) SEMW.l = lunesDe(DET.corte);
  if (!lunes.includes(SEMW.l)) SEMW.l = lunes[0];
  const dias = [0, 1, 2, 3, 4, 5, 6].map(i => sumDias(SEMW.l, i)), NM = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
  const sel = rows.filter(f => f[0] >= dias[0] && f[0] <= dias[6]), m = {};
  sel.forEach(f => { const a = m[f[3]] || (m[f[3]] = { d: {}, t: 0 }); a.d[f[0]] = (a.d[f[0]] || 0) + f[5]; a.t += f[5]; });
  const totD = dias.map(x => sel.filter(f => f[0] === x).reduce((a, f) => a + f[5], 0)), tot = totD.reduce((a, b) => a + b, 0), mx = Math.max(1, ...totD);

      { formula: `IF(OR(Resumen!$B$3="TODOS",A${r}=Resumen!$B$3),"Sí","No")` }]); });
    const CN = lista.length + 1;
    [4, 6, 8, 9].forEach(c => wc.getColumn(c).numFmt = money); wc.getColumn(7).numFmt = 'dd/mm/yyyy'; [10, 11].forEach(c => wc.getColumn(c).numFmt = pct);
    [34, 40, 20, 16, 11, 16, 13, 16, 16, 12, 12, 20, 12].forEach((w, i) => wc.getColumn(i + 1).width = w); wc.views = [{ state: 'frozen', xSplit: 2, ySplit: 1 }]; wc.autoFilter = 'A1:M' + CN;
    wc.addConditionalFormatting({ ref: 'L2:L' + CN, rules: [
      { type: 'cellIs', operator: 'equal', formulae: ['"Baja"'], style: { font: { color: { argb: 'FFB91C1C' }, bold: true } } },
      { type: 'cellIs', operator: 'equal', formulae: ['"Sin compra este mes"'], style: { font: { color: { argb: 'FFB91C1C' }, bold: true }, fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFFEE2E2' } } } },
      { type: 'cellIs', operator: 'equal', formulae: ['"Crece"'], style: { font: { color: { argb: 'FF047857' }, bold: true } } },
      { type: 'cellIs', operator: 'equal', formulae: ['"Nuevo / reactivado"'], style: { font: { color: { argb: 'FF1E40AF' }, bold: true } } }] });
    wc.addConditionalFormatting({ ref: 'M2:M' + CN, rules: [{ type: 'cellIs', operator: 'equal', formulae: ['"Sí"'], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFFEF9C3' } }, font: { bold: true } } }] });
    // Canales
    const canales = [...new Set(DET.rows.map(f => f[4]))].sort();
    const wk = SH['Canales']; wk.addRow(['Canal', 'Venta mes', 'Mes anterior', 'Variación %', '% del total']); hdr(wk, 1);
    canales.forEach((c, i) => { const r = i + 2; wk.addRow([c, { formula: `SUMIFS(${R('G')},${R('E')},A${r},${R('D')},Resumen!$B$6,${R('F')},Resumen!$B$4)` }, { formula: `SUMIFS(${R('G')},${R('E')},A${r},${R('D')},Resumen!$B$6,${R('F')},Resumen!$B$5)` }, { formula: `IF(C${r}=0,"",(B${r}-C${r})/C${r})` }, { formula: `IF(SUM($B$2:$B$${canales.length + 1})=0,0,B${r}/SUM($B$2:$B$${canales.length + 1}))` }]); });
    [2, 3].forEach(c => wk.getColumn(c).numFmt = money); [4, 5].forEach(c => wk.getColumn(c).numFmt = pct); [24, 16, 16, 12, 12].forEach((w, i) => wk.getColumn(i + 1).width = w);
    // Semanas
    const ws = SH['Semanas']; ws.addRow(['Semana desde (lunes)', 'Hasta', 'Venta', 'Acumulado', 'Gráfico']); hdr(ws, 1);
    const mondays = new Set(); D.cur.forEach(f => { const d = dt(f[0]); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); mondays.add(d.toISOString().slice(0, 10)); });
    const ms = [...mondays].sort(); const mN = ms.length + 1;
    ms.forEach((m, i) => { const r = i + 2, d = dt(m), e = new Date(d.getTime() + 6 * 86400000);
      ws.addRow([d, e, { formula: `SUMIFS(${R('G')},${R('D')},Resumen!$B$6,${R('A')},">="&A${r},${R('A')},"<="&B${r},${R('F')},Resumen!$B$4)` }, { formula: `SUM($C$2:C${r})` }, { formula: `REPT("█",IF(MAX($C$2:$C$${mN})=0,0,ROUND(C${r}/MAX($C$2:$C$${mN})*30,0)))` }]); });
    [1, 2].forEach(c => ws.getColumn(c).numFmt = 'dd/mm/yyyy'); [3, 4].forEach(c => ws.getColumn(c).numFmt = money); [20, 14, 16, 16, 40].forEach((w, i) => ws.getColumn(i + 1).width = w);
    // Resumen (primera hoja)
    wr.getColumn(1).width = 30; wr.getColumn(2).width = 40; wr.getColumn(3).width = 60;
    wr.addRow(['REPORTE DE VENTAS POR ASESOR']).font = { bold: true, size: 16 };
    wr.addRow([]);
    wr.addRow(['Asesor (elige de la lista)', DET.ase, '◄ Cambia este nombre y todo el libro se recalcula (hojas Resumen, Clientes, Canales y Semanas).']);
    wr.addRow(['Mes', mes, 'Mes del reporte']); wr.addRow(['Mes anterior', prev]);
    wr.addRow(['Criterio (no tocar)', { formula: 'IF(B3="TODOS","*",B3)' }]);
    wr.addRow(['Corte de datos', dt(DET.corte)]);
    wr.getCell('B3').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFEF9C3' } }; wr.getCell('B3').font = { bold: true, size: 12 };
    wr.getCell('B3').dataValidation = { type: 'list', allowBlank: false, formulae: ['Listas!$A$2:$A$' + LN] };
    wr.getCell('B7').numFmt = 'dd/mm/yyyy'; wr.getCell('C3').font = { italic: true, color: { argb: 'FF64748B' } };
    wr.addRow([]);
    const hr = wr.addRow(['Indicador', 'Valor']); Object.assign(hr.getCell(1), HD); Object.assign(hr.getCell(2), HD);
    const eq = `Equipo!$B$${eN + 1}`;
    const M = [
      ['Venta del mes', `SUMIFS(${R('G')},${R('D')},$B$6,${R('F')},$B$4)`, money],
      ['Venta mes anterior', `SUMIFS(${R('G')},${R('D')},$B$6,${R('F')},$B$5)`, money],
      ['Variación %', `IF(B11=0,"",(B10-B11)/B11)`, pct],
      ['Presupuesto del mes', `IF(B3="TODOS",Equipo!$C$${eN + 1},SUMIF(Equipo!$A$2:$A$${eN},B3,Equipo!$C$2:$C$${eN}))`, money],
      ['% de cumplimiento', `IF(B13=0,"",B10/B13)`, pct],
      ['Facturas del mes', `COUNTIFS(${R('D')},$B$6,${R('F')},$B$4)`, '#,##0'],
      ['Clientes con compra en el mes', `COUNTIFS(Clientes!$A$2:$A$${CN},$B$6,Clientes!$D$2:$D$${CN},">0")`, '#,##0'],
      ['Ticket promedio por factura', `IF(B15=0,0,B10/B15)`, money],
      ['% de la venta del equipo', `IF(${eq}=0,0,B10/${eq})`, pct],
      ['Proyección a fin de mes', `IF(TEXT($B$7,"yyyy-mm")<>$B$4,B10,IF(DAY($B$7)=0,0,B10/DAY($B$7)*DAY(EOMONTH($B$7,0))))`, money],
      ['Clientes que compraron el mes pasado y NO este mes', `COUNTIFS(Clientes!$A$2:$A$${CN},$B$6,Clientes!$D$2:$D$${CN},0,Clientes!$H$2:$H$${CN},">0")`, '#,##0']];
    M.forEach((m, i) => { const r = wr.addRow([m[0], { formula: m[1] }]); r.getCell(2).numFmt = m[2]; r.getCell(1).font = { bold: true }; r.getCell(2).font = { bold: true, size: 12 }; r.getCell(2).alignment = { horizontal: 'right' }; });
    wr.addRow([]); const nt = wr.addRow(['Cómo usarlo']); nt.font = { bold: true };
    ['1) Elige el asesor en la celda amarilla (B3). Todo se recalcula solo.', '2) Hoja «Clientes»: filtra la columna «En mi selección» = Sí para ver solo tus clientes, u ordena por Venta mes, Variación o Estado.', '3) Hoja «Facturas»: todas las facturas de ' + mesLbl(mes) + ' y ' + mesLbl(prev) + ' con filtros; puedes insertar una tabla dinámica sobre ella.', '4) Hoja «Equipo»: todos los asesores, para ver la meta total del equipo.', '5) Los datos son los facturados en Siesa hasta el ' + dmy(DET.corte) + '.'].forEach(t => wr.addRow([t]));
    const buf = await wb.xlsx.writeBuffer();
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    a.download = 'Ventas_por_asesor_' + mes + '.xlsx'; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { alert('No se pudo generar el Excel: ' + e.message); }
}
