  if (!nit || !det || !db || !cr) { alert('Falta NIT, detalle, cuenta DB o cuenta CxP.'); return; }
  const pct = (parseFloat(g('nPct').replace(',', '.')) || 0) / 100, fijo = parseFloat(g('nFijo').replace(/\./g, '').replace(',', '.')) || 0;
  p.rows.push({ nit, cli, cc: g('nCc'), det, pct, fijo: pct > 0 ? 0 : fijo, db, cr, off: false });
  if (cli) p.nom[cli.toUpperCase()] = nit;
  S.dirty = true; S.msg = ''; pintar();
}
function borraRegla(i) { const p = S.planos[S.sel], r = p.rows[i]; if (!confirm('¿Quitar la regla "' + r.det + '" de ' + r.cli + '?')) return; p.rows.splice(i, 1); S.dirty = true; S.msg = ''; pintar(); }
function setCampo(i, k, v) { const r = S.planos[S.sel].rows[i]; r[k] = (k === 'nit' || k === 'db' || k === 'cr') ? String(v).replace(/\D/g, '') : String(v).trim(); S.dirty = true; S.msg = ''; pintar(); }
function setFijo(i, v) { const r = S.planos[S.sel].rows[i]; r.fijo = parseFloat(String(v).replace(/\./g, '').replace(',', '.')) || 0; S.dirty = true; S.msg = ''; pintar(); }
// ---------- Archivos Base (hoja Base + hoja BD) ----------
async function leerBase(f) {
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
  if (!wb.Sheets.Base) throw new Error('El archivo ' + f.name + ' no tiene la hoja "Base".');
  const aoa = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: null, raw: true });
  const B = aoa('Base'), p = { nombre: f.name, tipo: /moderno/i.test(f.name) ? 'MODERNO' : 'OTROS', rows: [], bd: {}, nom: {}, ctaCr: '26059503', totCont: null, totDtoArch: null, fecha: '', lapso: '', tercero: '900053261', notas: '' };
  const lin = B.find(r => String(r[0] || '').trim().toLowerCase() === 'linea');
  if (lin) { p.totCont = +lin[5] || null; p.totDtoArch = +lin[6] || null; if (lin[7]) p.ctaCr = String(lin[7]).replace(/\D/g, ''); }
  const h = B.findIndex(r => String(r[0] || '').trim().toUpperCase() === 'NIT' && /CLIENTE/i.test(String(r[1] || '')));
  if (h < 0) throw new Error('No encuentro la fila de títulos (NIT, CLIENTE…) en la hoja Base.');
  for (let i = h + 1; i < B.length; i++) {
    const r = B[i], nit = nitLim(r[0]); if (!nit || !/^\d{5,}$/.test(nit)) { if (String(r[1] || '').toUpperCase().includes('GRAN TOTAL')) break; continue; }
    p.rows.push({ nit, cli: String(r[1] || '').trim(), cc: String(r[2] || '').replace(/\.0+$/, '').trim(), det: String(r[3] || '').trim(), pct: +r[4] || 0, ventaArch: +r[5] || 0, fijo: +r[4] > 0 ? 0 : (+r[6] || 0), dtoArch: +r[6] || 0, db: String(r[7] || '').replace(/\D/g, ''), cr: String(r[8] || '').replace(/\D/g, ''), off: false });
  }
  if (wb.Sheets.BD) {
    const D = aoa('BD'), g = k => { const r = D.find(x => String(x[0] || '').trim().toUpperCase() === k); return r ? r[1] : null; };
    p.fecha = String(g('FECHA') || '').replace(/\D/g, '').slice(0, 8); p.lapso = String(g('LAPSO') || '').replace(/\D/g, ''); p.notas = String(g('NOTAS') || '').trim();
    if (g('TERCERO')) p.tercero = nitLim(g('TERCERO'));
    D.forEach((r, i) => { const nit = nitLim(r[0]); if (i > 8 && /^\d{5,}$/.test(nit) && typeof r[4] === 'number') { p.bd[nit] = (p.bd[nit] || 0) + r[4]; p.nom[String(r[1] || '').trim().toUpperCase()] = nit; } });
  }
  if (!p.rows.length) throw new Error('No encontré reglas de descuento en la hoja Base de ' + f.name);
  return p;
}
async function subirBase(inp) {
  const err = [];
  for (const f of inp.files) { try { const p = await leerBase(f); const i = S.planos.findIndex(x => x.tipo === p.tipo); if (i >= 0) S.planos[i] = p; else S.planos.push(p); S.sel = S.planos.indexOf(p); if (p.totCont && !S.tc) S.tc = p.totCont; } catch (e) { err.push(e.message); } }
  inp.value = ''; if (err.length) alert(err.join('\n')); S.dirty = true; S.msg = ''; pintar();
}
// ---------- Ventas del mes (Siesa) ----------
async function traerVentas() {
  const b = $('bVen'); if (b) { b.disabled = true; b.textContent = '⏳ Consultando Siesa (puede tardar ~1 min)…'; }
  try {
    const d = await api('contabilidad-datos', { mes: S.mes });
    if (!d.ok) { alert(d.error || 'No se pudo traer las ventas'); } else {
      const mapa = {}, sinNit = {}; d.clientes.forEach(c => { if (c.nit) mapa[c.nit] = (mapa[c.nit] || 0) + c.venta; else sinNit[c.nombre.toUpperCase()] = (sinNit[c.nombre.toUpperCase()] || 0) + c.venta; });
      S.v = { total: d.total, docs: d.docs, notas: d.notas, mapa, sinNit, porTipo: d.porTipo, ts: new Date().toISOString() }; S.ventas[S.mes] = S.v; guardarBase(true);
    }
  } catch (e) { if (e.message !== 'auth') alert('Sin conexión con el servidor.'); }
  pintar();
}
// Venta de un NIT: Siesa si ya se trajo (las notas de clientes sin factura se unen por nombre usando la hoja BD), si no la del archivo
function ventaNit(p, nit) {
  if (!S.v) return p.bd[nit] || 0;
  let v = S.v.mapa[nit] || 0;
  for (const [nom, val] of Object.entries(S.v.sinNit)) if (p.nom[nom] === nit) v += val;
  return v;
}
function calcPlano(p) {
  p.rows.forEach(r => { r.venta = ventaNit(p, r.nit); r.dto = r.manual != null ? r.manual : dtoDe(r, r.venta, p.tipo); });
  const act = p.rows.filter(r => !r.off && r.dto !== 0);
  p.tot = Math.round(act.reduce((a, r) => a + r.dto, 0) * 100) / 100; p.act = act;
}
function setPct(i, v) { const r = S.planos[S.sel].rows[i]; r.pct = (parseFloat(String(v).replace(',', '.')) || 0) / 100; r.manual = null; S.dirty = true; S.msg = ''; pintar(); }
function setDto(i, v) { const r = S.planos[S.sel].rows[i]; const x = parseFloat(String(v).replace(/\./g, '').replace(',', '.')); r.manual = isNaN(x) ? null : x; pintar(); }
function setOff(i, v) { S.planos[S.sel].rows[i].off = !v; pintar(); }
function setP(k, v) { S.planos[S.sel][k] = v; pintar(); }
// Clave estable de una regla (NIT + C. costo + detalle + cuentas + n.º de repetición)
function clavesRegla(p) { const c = {}; return p.rows.map(r => { const b = [r.nit, r.cc, r.det, r.db, r.cr].join('|'); c[b] = (c[b] || 0) + 1; return b + '#' + c[b]; }); }
const genKey = p => p.lapso + '_' + p.tipo;
// Líneas del plano: 'completo' = todo el mes; 'pend' = solo lo que falta frente a lo ya generado (diferencia)
function lineasPlano(p, modo) {
  calcPlano(p); const ks = clavesRegla(p), g = S.gen[genKey(p)] || {}, out = [];
  p.rows.forEach((r, i) => {
    if (r.off) return;
    const prev = g[ks[i]] || 0, amt = modo === 'pend' ? Math.round((r.dto - prev) * 100) / 100 : r.dto;
    if (Math.abs(amt) >= 0.005) out.push({ cuenta: r.db, nit: r.nit, cc: r.cc, db: amt, cr: r.cr, k: ks[i], dto: r.dto, cli: r.cli });
  });
  return out;
}
async function descargar(modo) {
  if (!S.v) { await traerVentas(); if (!S.v) return; }
  const p = S.planos[S.sel]; modo = modo || 'completo'; const L = lineasPlano(p, modo);
  if (!L.length) { alert(modo === 'pend' ? 'No hay pendientes: todo lo del mes ya se generó.' : 'No hay descuentos para el plano.'); return; }
  if (!/^\d{8}$/.test(p.fecha)) { alert('La fecha debe ser AAAAMMDD (ej. 20261031).'); return; }
  const o = planoCPR(L.map(x => ({ cuenta: x.cuenta, nit: x.nit, cc: x.cc, db: x.db, cr: x.cr })), { fecha: p.fecha, notas: p.notas, ctaCr: p.ctaCr, tercero: p.tercero, porRegla: true });
  const sinCta = L.filter(r => !r.cuenta); if (sinCta.length && !confirm(sinCta.length + ' línea(s) no tienen cuenta débito. ¿Descargar de todos modos?')) return;
  const yaGen = Object.keys(S.gen[genKey(p)] || {}).length;
  if (!confirm('Plano CPR ' + p.tipo + (modo === 'pend' ? ' (SOLO PENDIENTES)' : ' (COMPLETO del mes)') + ': ' + o.n + ' líneas de débito por ' + fd(o.tot) + ' y créditos por el mismo valor ' + 'a la cuenta por pagar 23… de cada regla (tercero = cliente)' + '.' + (modo === 'completo' && yaGen ? '\nOJO: ya generaste planos de este mes; si ya los importaste en Siesa, este duplicaría la provisión.' : '') + '\n¿Descargar?')) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([o.txt], { type: 'text/plain;charset=iso-8859-1' })); a.download = 'Confidenciales_' + (p.tipo === 'MODERNO' ? 'Moderno' : 'Otros') + '_' + p.lapso + (modo === 'pend' ? '_pendientes' : '') + '.TXT'; a.click();
  const g = modo === 'pend' ? (S.gen[genKey(p)] || {}) : {}; L.forEach(x => { g[x.k] = x.dto; });
  if (modo === 'completo') { const ks = clavesRegla(p); p.rows.forEach((r, i) => { if (!r.off) g[ks[i]] = r.dto; }); }
  S.gen[genKey(p)] = g; S.msg = 'Marcado como generado. Guardando…'; pintar(); guardarBase();
}
function reiniciaGen() { const p = S.planos[S.sel]; if (!confirm('¿Borrar la marca de "ya generado" de ' + p.tipo + ' ' + p.lapso + '? Los pendientes volverán a ser todo el mes.')) return; delete S.gen[genKey(p)]; guardarBase(); }
// ---------- Cuentas por pagar (VPP/MAS) abiertas frente a lo provisionado ----------
async function verCxp(nit) {
  S.cxp[nit] = 'cargando'; pintar();
  try { const d = await api('cartera-datos', {}, { accion: 'cxp', nit }); S.cxp[nit] = d && d.ok ? (d.rows || []) : 'error'; } catch (e) { S.cxp[nit] = 'error'; }
  pintar();
}
const cxpSaldo = d => Math.abs((d.cr || 0) - (d.db || 0));
function cxpHtml(p) {
  const nits = [...new Set(p.act.map(r => r.nit))];
  const rows = nits.map(nit => {
    const rs = p.act.filter(r => r.nit === nit), prov = rs.reduce((a, r) => a + r.dto, 0), c = S.cxp[nit];
    let det = '<button class="btn g" onclick="verCxp(\'' + nit + '\')">Consultar CxP</button>', sal = '';
    if (c === 'cargando') det = '<span class="n">Consultando…</span>'; else if (c === 'error') det = '<span class="mal">No se pudo consultar</span> <button class="btn g" onclick="verCxp(\'' + nit + '\')">Reintentar</button>';
    else if (Array.isArray(c)) { const x = c.filter(d => /^233595/.test(String(d.cuenta))); const t = x.reduce((a, d) => a + cxpSaldo(d), 0); sal = fm(t);
      det = x.length ? x.slice(0, 40).map(d => '<div class="n">' + esc(String(d.cuenta)) + ' · ' + esc(String(d.fecha || '').slice(0, 10)) + ' · ' + fm(cxpSaldo(d)) + ' · ' + esc(String(d.notas || '').slice(0, 60)) + '</div>').join('') + (x.length > 40 ? '<div class="n">… y ' + (x.length - 40) + ' más</div>' : '') : '<span class="n">Sin CxP 233595xx abiertas</span>'; }
    return '<tr><td class="l">' + esc(nit) + '</td><td class="l">' + esc(rs[0].cli) + '</td><td>' + fd(prov) + '</td><td>' + sal + '</td><td class="l">' + det + '</td></tr>';
  }).join('');
  return '<div class="card"><h2>🧾 Cuentas por pagar abiertas (VPP/MAS, cuentas 233595xx) vs lo provisionado este mes</h2><div class="inf">El plano provisiona el descuento (débito al gasto 5305xxxx, crédito a ' + esc(p.ctaCr) + '). Aquí ves, por cliente, lo que ya hay abierto en cuentas por pagar en Siesa para compararlo al cruzar el recibo.</div><div class="tw"><table><thead><tr><th class="l">NIT</th><th class="l">Cliente</th><th>Dto este mes</th><th>CxP abierta</th><th class="l">Detalle</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
}
function planoHtml(p) {
  calcPlano(p);
  const dif = p.totDtoArch != null ? p.tot - p.totDtoArch : null;
  const trs = p.rows.map((r, i) => {
    const dv = S.v && p.bd[r.nit] != null && Math.abs(r.venta - p.bd[r.nit]) > 1;
    if (S.edit) return '<tr><td><button class="btn g" title="Quitar regla" onclick="borraRegla(' + i + ')">🗑</button></td><td class="l"><input value="' + esc(r.nit) + '" onchange="setCampo(' + i + ',\'nit\',this.value)" style="width:85px"></td><td class="l"><input value="' + esc(r.cli) + '" onchange="setCampo(' + i + ',\'cli\',this.value)" style="width:150px"></td><td><input value="' + esc(r.cc) + '" onchange="setCampo(' + i + ',\'cc\',this.value)" style="width:65px"></td><td class="l"><input value="' + esc(r.det) + '" onchange="setCampo(' + i + ',\'det\',this.value)" style="width:190px"></td>'

      + '<td><input value="' + (r.pct * 100).toFixed(2).replace(/\.?0+$/, '') + '" onchange="setPct(' + i + ',this.value)" style="width:38px">%</td><td>' + fm(r.venta) + (dv ? '<div class="n">archivo ' + fm(p.bd[r.nit]) + '</div>' : '') + '</td>'

    + '<div class="bar"><label>Fecha <input value="' + esc(p.fecha) + '" style="width:90px" onchange="S.planos[S.sel].fecha=this.value.replace(/\\D/g,\'\')"></label><label>Lapso <input value="' + esc(p.lapso) + '" style="width:70px" onchange="S.planos[S.sel].lapso=this.value.replace(/\\D/g,\'\')"></label><label>Notas <input value="' + esc(p.notas) + '" style="width:280px" onchange="S.planos[S.sel].notas=this.value"></label></div>'
    + '<div class="kpis"><div class="kpi"><div class="l">Líneas con descuento</div><div class="v">' + p.act.length + '</div></div><div class="kpi"><div class="l">Total descuentos</div><div class="v">' + fd(p.tot) + '</div><div class="s">' + (dif == null ? '' : dif === 0 || Math.abs(dif) < 1 ? '<span class="ok">= al archivo</span>' : 'archivo ' + fd(p.totDtoArch) + ' · dif ' + fd(dif)) + '</div></div><div class="kpi"><div class="l">Ventas usadas</div><div class="v" style="font-size:14px">' + (S.v ? 'Siesa ' + S.mes : 'Pendiente: traer ventas') + '</div><div class="s">Amarillo = difiere del archivo</div></div></div>'

}
function pintar() {
