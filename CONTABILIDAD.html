  if (!/^\d{8}$/.test(R.fecha)) return { err: 'La fecha debe ser AAAAMMDD (ej. 20261030).' };

/* ===== Inventario por corte (export de Siesa: costo promedio instalación) ===== */

}
async function ivAbrir(c) {

    + '<button class="btn" ' + (IV.ocupado ? 'disabled' : '') + ' onclick="ivSiesaHoy()">🔄 Traer inventario de hoy desde Siesa</button>'
    + '<label>Subir Excel de Siesa · fecha del corte <input type="date" id="ivFecha" value="' + ivUltimoMesAnt() + '"></label><input type="file" accept=".xlsx,.xlsm,.xls" onchange="ivSubir(this)">'
    + (IV.corte ? '<button class="btn g" onclick="ivBorrar()">🗑 Borrar este corte</button>' : '') + '<span class="n">' + esc(IV.msg) + '</span></div>'
    + '<div class="inf">Mismas columnas del informe de Siesa: bodega, referencia, descripción, tipo de inventario, existencia y costo promedio (unitario y total) por instalación. <b>Cada mes</b> sube el Excel que sacas de Siesa con el corte al último día del mes y queda guardado para filtrarlo. «Traer inventario de hoy» lee la consulta <b>API_v2_Inventarios_InvFecha</b> de Siesa (campos f400_costo_prom_uni / f400_costo_prom_tot); la descripción y el tipo salen del portal. Las filas en amarillo tienen existencia y costo en cero.</div></div>';

function ivPaint() {

    { k: 'bod', t: 'Bodega', v: r => r.bod }, { k: 'ref', t: 'Referencia', v: r => r.ref }, { k: 'des', t: 'Desc. item', v: r => r.des, wrap: true }, { k: 'tipo', t: 'Desc. tipo inventario', v: r => r.tipo, wrap: true },

function ivFechaDeNombre(n) {
  const M = { enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6, julio: 7, agosto: 8, septiembre: 9, setiembre: 9, octubre: 10, noviembre: 11, diciembre: 12 };
  const s = String(n || '').toLowerCase(); for (const k in M) { const m = new RegExp(k + '[^0-9]*(\\d{1,2})').exec(s); if (m) { const y = new Date().getFullYear(); return y + '-' + String(M[k]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0'); } } return '';
}
async function ivSubir(inp) {
  const f = inp.files && inp.files[0]; if (!f) return; inp.value = '';
  let corte = ($('ivFecha') || {}).value || ''; const dn = ivFechaDeNombre(f.name); if (dn && !corte) corte = dn;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(corte)) { alert('Pon la fecha del corte (último día del mes).'); return; }
  if (IV.cortes && IV.cortes.some(c => c.corte === corte) && !confirm('Ya hay un corte al ' + ivFecha(corte) + '. ¿Reemplazarlo con este archivo?')) return;
  IV.ocupado = true; IV.msg = 'Leyendo ' + f.name + '…'; pintar();

    const H = A[hi].map(n), ix = p => H.findIndex(h => h.startsWith(p));
    const c = { b: ix('bodega'), r: ix('referencia'), d: ix('desc. item'), t: ix('desc. tipo'), e: ix('existencia'), u: ix('costo prom. unit'), o: ix('costo prom. tot') };
    if (c.b < 0 || c.r < 0 || c.e < 0 || c.u < 0) throw new Error('Faltan columnas (Bodega, Referencia, Existencia, Costo prom. unit.)');
    const num = v => typeof v === 'number' ? v : (parseFloat(String(v || '0').replace(/\$/g, '').replace(/\./g, '').replace(',', '.')) || 0);
    const filas = []; for (let i = hi + 1; i < A.length; i++) { const r = A[i], b = String(r[c.b] || '').trim(), rf = String(r[c.r] == null ? '' : r[c.r]).trim(); if (!b || !rf || n(b) === 'gran total') continue; const ex = num(r[c.e]), cu = num(r[c.u]); filas.push([b, rf, c.d >= 0 ? r[c.d] : '', c.t >= 0 ? r[c.t] : '', ex, cu, c.o >= 0 ? num(r[c.o]) : Math.round(ex * cu * 100) / 100]); }

  } catch (e) { IV.ocupado = false; if (e.message !== 'auth') { IV.msg = ''; pintar(); alert('No se pudo cargar: ' + e.message); } }
}
async function ivSiesaHoy() {
