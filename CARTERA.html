<body>
<div class="hdr"><h1>ILU<span>MAX</span> · Cartera</h1><div class="sub" id="sub"></div><button class="out" id="out" style="display:none" onclick="pinSalir()">Salir</button></div>

function plPut(s, pos, txt, w, right) { txt = String(txt == null ? '' : txt); txt = right ? txt.padStart(w, '0').slice(-w) : txt.padEnd(w, ' ').slice(0, w); return s.slice(0, pos) + txt + s.slice(pos + w); }
const plAmt = n => { n = Math.round(n * 10000) / 10000; return (n < 0 ? '-' : '+') + Math.abs(n).toFixed(4).padStart(20, '0'); };

function plCart(seq, tipo, cons, d, nit, valor, notas) {

// Línea de retención (débito 1355xxxx con base) sobre el layout de la línea de banco
function plRet(seq, tipo, cons, cuenta, nit, valor, base, notas, aux) {

function plBanco(seq, tipo, cons, cuenta, valor, fecha, notas) {

function plMas(seq, tipo, cons, cuenta, nit, m, notas) {

// items: [{d, cartera, monto, ica, rte, bruto, iva}], o: {tipo, cons, fecha, nit, ctaIca, ctaRte, ctaBanco, notas}
// Recibo completo: banco (lo pagado) + ICA + RTE IVA = créditos a cartera por el valor cartera de cada factura
function conPlano(items, o) {
