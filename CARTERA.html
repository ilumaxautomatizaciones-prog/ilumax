<div class="hdr"><h1>ILU<span>MAX</span> · Cartera</h1><div class="sub" id="sub"></div><button class="out" id="out" style="display:none" onclick="pinSalir()">Salir</button></div>

    + '<input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="• • • •" style="width:100%;font-size:26px;letter-spacing:8px;text-align:center;padding:10px;border:1.5px solid #cbd5e1;border-radius:10px" onkeydown="if(event.key===\'Enter\')pinOk()">'
    + (msg ? '<div style="color:#b91c1c;font-size:12.5px;margin-top:8px">' + esc(msg) + '</div>' : '')

function pinOk() {

function pinSalir() { try { localStorage.removeItem('ca_pin'); } catch (e) {} location.href = location.pathname; }

}

  cls.forEach(c => { const v = vd[c.vend] || (vd[c.vend] = { vend: c.vend, b: [0, 0, 0, 0, 0], fav: 0, tot: 0, cls: [] }); c.b.forEach((n, i) => v.b[i] += n); v.fav += c.fav; v.tot += c.tot; v.cls.push(c); });
  return { ...d, docsL: docs, cls, vds: Object.values(vd), recs: d.rec.map(x => ({ fecha: x[0], doc: x[1], nit: x[2], cli: x[3], valor: x[4], notas: x[5], banco: x[6] })) };

const sumB = (a) => a.reduce((s, c) => s + c.b.reduce((x, y) => x + y, 0), 0);

  $('out').style.display = '';

    + kpi('Vencida', fmc(venc), pos ? Math.round(venc / pos * 100) + '% de la cartera' : '')

    + '<div class="tabs">' + tabs.map(t => '<button class="tab' + (TAB === t[0] ? ' on' : '') + '" onclick="TAB=\'' + t[0] + '\';OPEN={};pintar()">' + t[1] + '</button>').join('') + '<button class="tab" id="refbtn" onclick="actualizar()">🔄 Actualizar</button></div>'

const kpi = (l, v, s) => '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>';
function barra(extra) {

function vendSel() {

function filtrarCli() {

}
function cellsB(b, fav, tot) { return b.map((n, i) => '<td class="' + (i === 2 ? 'r1' : i === 3 ? 'r2' : i === 4 ? 'r3' : '') + '">' + (n ? fm(n) : '–') + '</td>').join('') + '<td class="fav">' + (fav ? fm(fav) : '–') + '</td><td><b>' + fm(tot) + '</b></td>'; }

function cxpNitQ() { const q = Q.replace(/[.\s-]/g, ''); return /^\d{6,12}$/.test(q) ? q : ''; }

function filaDocs(ds) {

function vista(soloTabla) {

/* ---- carga inicial desde el Excel EXTRACTO 2026 (solo administrador) ---- */
const ORD_MES = { ENERO: 1, FEBRERO: 2, MARZO: 3, ABRIL: 4, MAYO: 5, JUNIO: 6, JULIO: 7, AGOSTO: 8, SEPTIEMBRE: 9, OCTUBRE: 10, NOVIEMBRE: 11, DICIEMBRE: 12 };
